<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revision Feedback</title><link rel="stylesheet" href="styles.css"></head>
<body class="login-page"><main class="login-card"><p class="eyebrow">Oldmachar Academy</p><h1>Revision Feedback</h1><p class="muted">Sign in to view or manage assessment feedback.</p><form id="login-form"><label for="role">Account type</label><select id="role"><option value="teacher">Teacher</option><option value="pupil">Pupil</option></select><label id="identifier-label" for="identifier">Teacher email</label><input id="identifier" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary full" type="submit">Sign in</button><p id="login-error" class="message error" role="alert"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="login.js"></script></body></html>
